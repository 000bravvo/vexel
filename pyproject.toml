[project]
name = "vexel"
version = "0.1.0"
description = "Domain-agnostic multi-vector image search library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["visual-search", "image-search", "clip", "vector-search", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime: only lightweight deps required unconditionally.
# Heavy ML / vector-store deps are optional extras.
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "pillow>=10.0",
    "imagehash>=4.3",
]

[project.optional-dependencies]
clip    = ["open-clip-torch>=2.20"]
qdrant  = ["qdrant-client>=1.7,<1.10"]
pinecone = ["pinecone-client>=3.0"]
opencv  = ["opencv-python-headless>=4.8,<5"]
dev     = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.5",
    "ruff>=0.5",
    "black>=24.0",
]
all = [
    "vexel[clip,qdrant,opencv]",
]

[project.scripts]
vexel = "vexel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vexel"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I", "E", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]